services:
  postgres:
    image: postgres:16-alpine
    container_name: pdt-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-payment_defense_twin}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_now}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-payment_defense_twin}",
        ]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdt-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DB_URL: "postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-change_me_now}@postgres:5432/${POSTGRES_DB:-payment_defense_twin}"
      RED_TEAM_USE_LLM: "true"
      LLM_PROVIDER: openrouter
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
      OPENROUTER_MODEL: openai/gpt-4o
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
